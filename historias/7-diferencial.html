    <div class="vignette sand"></div>

    <div class="story center">
      <div class="body">
        <div class="fade" style="display:flex;flex-direction:column;align-items:center;margin-bottom:44px">
          <div class="emblem">

          Recomendado, <span class="grad">no acumulado.</span>

        <div class="fade fade-3" style="display:flex;flex-direction:column;gap:24px;margin-top:64px;width:100%;max-width:780px">

            </span>
            Señalado por gente local
          </div>
          <div class="mini-card glass">
            <span class="ico">
              <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg>

              <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M5 5l14 14"/></svg>

            No se paga por aparecer
          </div>
        </div>

        <p class="display fade fade-4" style="margin-top:60px;font-size:38px;font-weight:700;color:var(--verde-600);max-width:920px">
          Se gana en la calle y se mantiene vivo con la gente local.
        </p>
