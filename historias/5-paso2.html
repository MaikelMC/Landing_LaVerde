<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>La Verde — Historia 5 · Paso 2: El dato real</title>

<body>
  <div class="slide sand">
    <div class="orb orb-green" style="width:500px;height:500px;right:-160px;top:-150px"></div>
    <div class="orb orb-lime" style="width:460px;height:460px;left:-170px;bottom:-140px"></div>
    <div class="vignette sand"></div>

    <div class="story center">
      <div class="body">
        <span class="eyebrow fade"><span class="dot"></span>Paso 2 · El dato real</span>

        <p class="display h1 fade fade-1" style="margin-top:56px">
          Entiende el <span class="grad">contexto cubano.</span>

        <p class="sub fade fade-2" style="margin-top:26px">
          Precio, horario, moneda y ambiente. Sin misterio.

          <div class="cover"></div>
          <div class="body">

            <div class="data-row">
              <span class="label">Precio</span>
              <span class="value">$15&ndash;30 &nbsp;

                <span class="currency-pill pill-cup">CUP</span>
                <span class="currency-pill pill-usd">USD</span>
              </span>

            <div class="data-row">
              <span class="label">Horario</span>
              <span class="value">Hasta las 12</span>
            </div>
            <div class="data-row">
              <span class="label">Ambiente</span>
              <span class="value">Tranquilo, con música</span>
            </div>
          </div>
        </div>

        <p class="display fade fade-3" style="margin-top:52px;font-size:38px;font-weight:700;color:var(--verde-600);max-width:840px">
          Sabes cuánto gastarás <span style="white-space:nowrap">antes de salir de casa.</span>
        </p>
      </div>
      <div class="page-num">05 / 08</div>
    </div>
  </div>
