<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>La Verde — Historia 3 · La promesa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />

<body>
  <div class="slide dark">
    <div class="orb orb-lime" style="width:620px;height:620px;left:-190px;top:-140px"></div>

    <div class="particles"></div>
    <div class="vignette"></div>

    <div class="story center">
      <div class="body">
        <div class="logo-wrap fade" style="position:relative;width:260px;height:260px;margin-bottom:64px">
          <span class="halo"></span>
          <img class="logo-mark" src="assets/logo.svg" alt="La Verde" />
          <img src="assets/spark.svg" alt="" style="position:absolute;top:-8px;right:-14px;width:92px;height:92px" />
        </div>

        <div class="fade fade-1" style="display:flex;gap:28px;margin-bottom:64px">
          <div class="mini-card glass" style="width:250px;justify-content:center;text-align:center">
            <span class="ico">
              <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h11v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8Z"/><path d="M15 10h2a2 2 0 0 1 0 4h-2"/><path d="M8 2v2M12 2v2"/></svg>
            </span>
            Restaurantes
          </div>
          <div class="mini-card glass" style="width:250px;justify-content:center;text-align:center">
            <span class="ico">
              <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>

          </div>
          <div class="mini-card glass" style="width:250px;justify-content:center;text-align:center">
            <span class="ico">
              <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </span>
            Playas
          </div>
        </div>

        <p class="display h1 fade fade-2" style="max-width:880px">
          La Verde te dice <span class="grad">a dónde ir.</span>
        </p>

        <p class="sub fade fade-3" style="margin-top:30px">
          El lugar correcto, cerca de ti.
        </p>

        <p class="display fade fade-4" style="margin-top:56px;font-size:40px;font-weight:700;color:var(--emerald)">
          Pregúntale con tus palabras.
        </p>
      </div>
      <div class="page-num">03 / 08</div>
    </div>
